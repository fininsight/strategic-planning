name: Weekly G2B Opportunity Scan

on:
  schedule:
    # GitHub cron is UTC. 00:00 UTC = 09:00 KST.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Seoul
      G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Chrome
        run: |
          google-chrome-stable --version || google-chrome --version || chromium --version

      - name: Remove tracked attachment files
        run: rm -rf web/public/data/attachments

      - name: Run opportunity scanner
        run: |
          python src/opportunity_scanner/scanner.py \
            --top-n 999 \
            --preload-attachments \
            --preload-top-n 20

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2b-opportunity-scan-${{ github.run_number }}
          path: |
            reports/*.xlsx
            logs/scanner.log
          if-no-files-found: error
          retention-days: 30

      - name: Commit scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch web/public/data/attachments
          git add web/public/data/notices.json
          find web/public/data/analyses -name "*.json" -print0 | xargs -0 -r git add -f
          if git diff --cached --quiet; then
            echo "No scan data changes to commit."
          else
            git commit -m "chore: update weekly G2B scan data"
            git push origin HEAD:develop
          fi

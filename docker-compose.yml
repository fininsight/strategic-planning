services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      ANALYSIS_HOST: 0.0.0.0
      ANALYSIS_PORT: 8787
      API_ORIGIN: ""
      OPPORTUNITY_ATTACHMENT_DIR: /data/attachments
      OPPORTUNITY_ANALYSIS_DIR: /data/analyses
      DATABASE_URL: postgresql://fi:${POSTGRES_PASSWORD:-change_me}@postgres:5432/fi_strategic_planning
      CHROME_PROFILE_ROOT: /tmp
      CHROME_HEADLESS_ARG: "--headless"
      CHROME_EXTRA_ARGS: ""
    volumes:
      - /data/fi-strategic-planning/attachments:/data/attachments
      - /data/fi-strategic-planning/analyses:/data/analyses
      - /data/fi-strategic-planning/logs:/app/logs
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fi_strategic_planning
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_password}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data:
